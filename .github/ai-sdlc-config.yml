# Project-specific configuration for ai-sdlc-agents plugin
# Generated by /sdlc:init on 2026-04-29.

project:
  name: "NurtureOS"
  type: "monorepo"  # frontend at repo root + backend/ workspace

build:
  tool: npm
  # Run from repo root unless noted. {workspace} is "frontend" (root) or "backend".
  compile: "npm run build"                      # frontend: tsc -b && vite build
  compile_backend: "cd backend && npm run build"  # tsc to dist/
  typecheck_backend: "cd backend && npm run typecheck"
  lint: "npm run lint"
  test: "echo 'no test framework configured yet'"  # see knowledge/test-patterns.md
  dev: "npm run dev"                            # frontend dev server (Vite, --host)
  dev_backend: "cd backend && npm run dev"      # tsx watch
  start_full: "npm start"                       # builds frontend + runs preview + backend with sync

conventions:
  language: typescript
  framework: react           # frontend
  framework_backend: express # backend
  injection: none            # functional React + module-scoped Zustand stores
  state_management: zustand-persist  # localStorage-backed, key prefix "nurtureos-*"
  routing: react-router-dom
  styling: tailwindcss
  pwa: vite-plugin-pwa
  test_annotations: "none — no test framework wired up yet"
  layers: "pages/ → hooks/ + components/{layout,ui} → store/ + lib/ + types/ + data/"
  naming:
    files: "kebab-case for utilities, PascalCase for components/pages"
    identifiers: "camelCase for functions/vars, PascalCase for types/components"
  imports: "explicit, named; `import type` for type-only imports; barrel index.ts in store/, types/, components/{layout,ui}"
  # No feature flag system; toggles use Vite env vars (e.g. VITE_SYNC_URL).

knowledge_files:
  - ".github/knowledge/build-system.md"
  - ".github/knowledge/domain-model.md"
  - ".github/knowledge/architecture.md"
  - ".github/knowledge/test-patterns.md"
  - ".github/knowledge/infrastructure-checklists.md"
  - ".github/knowledge/lessons-learned.md"

instruction_files:
  - ".github/copilot-instructions.md"   # legacy, contains hard-bug rules still in force
  - ".github/git-commit-instructions.md"

artifacts_dir: ".dev"             # LLDs, plans, task breakdowns
review_dir: "PR-Review"           # code reviews
lessons_file: ".github/knowledge/lessons-learned.md"

issue_tracker:
  type: none                      # Conventional Commits style; no ticket prefix
  id_pattern: ""                  # no ticket IDs in branch/commit history

# E2E testing — not configured. Manual smoke test plan lives in PRD V1.md and ad-hoc.
